[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modagent"
version = "1.5.0"
description = "LLM 驱动的 PC 游戏 mod 管理器"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "openai>=1.0.0",
]

[tool.setuptools]
packages = ["modagent", "modagent.sources"]

[tool.setuptools.package-data]
modagent = ["default_prompt.md"]
